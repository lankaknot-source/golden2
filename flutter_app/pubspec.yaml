name: golden_hand_care
description: "Golden Hand Caregivers - A healthcare caregiving platform connecting clients with professional caregivers."
publish_to: 'none'
version: 1.3.1+16

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4       # Realtime Database (chat, live tracking)
  firebase_messaging: ^15.1.3      # FCM push notifications
  firebase_app_check: ^0.3.1+3

  # ── Google Services ───────────────────────────────────────────────────────
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.9.0

  # ── Location & Permissions ────────────────────────────────────────────────
  geolocator: ^13.0.2              # GPS location
  permission_handler: ^11.3.1      # Runtime permissions

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── State Management (Riverpod — ViewModel/StateFlow equivalent) ──────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Notifications & Alarms ────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2   # Medicine reminders & local alerts (exact alarms)

  # ── Background Tasks (WorkManager equivalent) ─────────────────────────────
  workmanager: ^0.9.0

  # ── Image & File Handling ─────────────────────────────────────────────────
  image_picker: ^1.1.2                   # Camera / gallery (task proof photos)
  flutter_image_compress: ^2.3.0         # Upload optimization
  cached_network_image: ^3.4.1           # Efficient remote image display
  file_picker: ^8.1.2                    # Document uploads (KYC)

  # ── PDF Generation (Care Logs export) ────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.0.5             # Offline detection

  # ── Payments ──────────────────────────────────────────────────────────────
  flutter_stripe: ^11.1.0              # Wallet & payment processing

  # ── Local Storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.0                         # Date formatting & localisation
  url_launcher: ^6.3.0
  uuid: ^4.5.1                          # Generate IDs client-side
  equatable: ^2.0.5                     # Value equality for models
  collection: ^1.19.0
  path: ^1.9.0                          # File path utilities
  timezone: ^0.9.4                      # TZDateTime for scheduled notifications

  # ── UI & Animation ────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2                        # Splash / loading animations
  shimmer: ^3.0.0                       # Skeleton loading placeholders
  fl_chart: ^0.69.0                     # Wallet / earnings charts
  photo_view: ^0.15.0                   # Full-screen image viewer (task proofs)
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3           # Code-gen for @riverpod providers
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.1      # App icon generation (Android + iOS)

# ── App icon (dart run flutter_launcher_icons) ───────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true               # App Store rejects icons with alpha
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true                        # Enables flutter gen-l10n for ARB files

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
