workflows:
  ios-test-unsigned:
    name: iOS Test Build (unsigned, free)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: flutter_app

    environment:
      flutter: 3.41.2
      xcode: 16.2
      cocoapods: 1.16.2

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile

      - name: Validate Flutter project
        script: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
          python3 -B -m unittest discover -s tool -p 'test_*.py'
          python3 tool/check_ios_configuration.py

      - name: Patch legacy Firebase iOS headers
        script: |
          set -euo pipefail
          python3 tool/patch_firebase_ios.py
          python3 tool/configure_ios_firebase.py

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Build iOS without code signing
        script: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --build-number="$BUILD_NUMBER"

    artifacts:
      - flutter_app/build/ios/iphoneos/Runner.app
      - flutter_app/ios/Podfile.lock
      - /tmp/xcodebuild_logs/*.log

  ios-appstore:
    name: iOS App Store (signed, TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: flutter_app

    integrations:
      app_store_connect: CodemagicAppStoreConnect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kina.goldenHandCare
      flutter: 3.41.2
      xcode: 16.2
      cocoapods: 1.16.2

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile

      - name: Validate Flutter project
        script: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
          python3 -B -m unittest discover -s tool -p 'test_*.py'
          python3 tool/check_ios_configuration.py

      - name: Patch legacy Firebase iOS headers
        script: |
          set -euo pipefail
          python3 tool/patch_firebase_ios.py
          python3 tool/configure_ios_firebase.py

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Configure automatic code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - flutter_app/build/ios/archive/*.xcarchive
      - flutter_app/ios/Podfile.lock
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
